<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfeffd" />
      <stop offset="100%" stop-color="#e6f7ff" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)" />
  <g fill="#ffffff" opacity="0.9" filter="url(#f1)">
    <ellipse cx="200" cy="180" rx="120" ry="50" />
    <ellipse cx="300" cy="160" rx="140" ry="60" />
    <ellipse cx="380" cy="190" rx="100" ry="45" />
    <ellipse cx="800" cy="120" rx="160" ry="70" />
    <ellipse cx="920" cy="150" rx="110" ry="50" />
    <ellipse cx="1000" cy="130" rx="90" ry="40" />
    <ellipse cx="600" cy="220" rx="200" ry="80" />
    <ellipse cx="480" cy="240" rx="140" ry="60" />
  </g>
</svg>